<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sanad Generator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="controls">
        <h2>Sanad Generator (HD PNG)</h2>
        <select id="certType">
            <option value="Old_Nazra">Nazra Sanad</option>
            <option value="Old_Hifz">Hifz Sanad</option>
        </select>
        
        <!-- Action Buttons -->
        <button onclick="updateCache()" style="background-color: #ff9800; color: white;">🔄 Update Cache (Sheet se naya data layein)</button>
        <br><br>
        
        <input type="text" id="regNo" placeholder="G.R.No (Registration No) darj karein">
        <button onclick="fetchData()">Sanad Banao</button>
        <button onclick="downloadPNG()" id="printBtn" style="display:none; background-color: #28a745; color: white;">📥 Download HD PNG</button>
        
        <p id="status" style="font-weight: bold; color: blue;"></p>
    </div>

    <div class="cert-wrapper" id="certWrapper" style="display:none;">
        <div id="certificate" class="certificate">
            <!-- Background Image -->
            <img id="certImage" src="" alt="Sanad Background">
            
            <!-- Transparent Text Layer -->
            <div id="textLayer" class="text-layer">
                <!-- Top Details -->
                <div id="grNo" class="field"></div>
                <div id="serialNo" class="field"></div>
                
                <!-- Left Side (English) -->
                <div id="madrasaEng" class="field eng-font"></div>
                <div id="studentEng" class="field eng-font"></div>
                <div id="dobEng" class="field eng-font"></div>
                <div id="residenceEng" class="field eng-font"></div>
                <div id="gradeEng" class="field eng-font"></div>
                <div id="examDateEng" class="field eng-font"></div>

                <!-- Right Side (Urdu) -->
                <div id="madrasaUrdu" class="field urdu-font"></div>
                <div id="studentUrdu" class="field urdu-font"></div>
                <div id="dobUrdu" class="field urdu-font"></div>
                <div id="residenceUrdu" class="field urdu-font"></div>
                <div id="gradeUrdu" class="field urdu-font"></div>
                <div id="examDateUrdu" class="field urdu-font"></div>
                
                <!-- Bottom Issue Date -->
                <div id="issueDateUrdu" class="field urdu-font"></div>
            </div>
        </div>
    </div>

    <!-- Cache bypass -->
    <script src="script.js?v=3.0"></script>
</body>
</html>
